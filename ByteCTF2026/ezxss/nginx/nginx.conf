worker_processes  auto;

user www-data;

events {
    worker_connections  1024;
}
error_log /var/log/nginx/error.log;

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;
    
  upstream web {
    server web:3000;
  }

  upstream bot {
    server bot:5000;
  }


  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=1h use_temp_path=off;

  server {
    client_body_buffer_size 10M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffer_size 16k;
    proxy_buffers 4 32k;

    listen 80;

    location / {
      proxy_pass http://web;
      proxy_cache_key $uri;
      proxy_cache static_cache;
      proxy_cache_valid 200 1h;
      add_header X-Cache $upstream_cache_status;
      add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self';";
    }

    location /bot {
      proxy_pass http://bot;
    }

    location /sys {
      root /;
      autoindex on;
    }
  }
}