<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot Visit</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:40px;color:#222}
    .box{max-width:640px;margin:auto}
    input[type=text]{width:100%;padding:12px 14px;border:1px solid #ccc;border-radius:6px;font-size:16px}
    button{margin-top:12px;padding:10px 16px;font-size:16px;border:0;border-radius:6px;background:#2f6feb;color:#fff;cursor:pointer}
    button:hover{background:#1f5cda}
    .hint{color:#666;font-size:14px;margin:6px 0 18px}
    .host{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;color:#4b5563}
  </style>
  </head>
<body>
  <div class="box">
    <h2>Submit a Path for the Bot to Visit</h2>
    <p class="hint">The target URL will be constructed by concatenating your current request's hostname and protocol, e.g. <span class="host"><script>document.write(location.protocol+"//"+location.host)</script></span> + the Path you provide.</p>
    <p class="hint">PoW: find a suffix such that SHA256(challenge + suffix) begins with {{ '0' * difficulty }}.</p>
    <p class="hint">challenge: <span class="host">{{ challenge }}</span></p>
    <form method="post" action="{{ url_for('visit') }}">
      <label for="path">Path</label>
      <input id="path" name="path" type="text" placeholder="/?q=1" required>
      <label for="pow">PoW Suffix</label>
      <input id="pow" name="pow" type="text" placeholder="e.g. abc123" required>
      <button type="submit">Visit and Capture Screenshot</button>
    </form>
  </div>
</body>
</html>
